  <link rel="stylesheet" href="assets/css/style.css">

<body class="home">

  <!-- ===== Header (same on every page) ===== -->
  <header class="site-header">
    <a href="index.html" class="logo">Flatroot</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Open menu">
    <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true"><span></span></label>
    <nav class="navigation" aria-label="Main">
        <a href="index.html" class="active" aria-current="page">Home</a>

  <main>

    <section class="products" id="best-sellers">

      <div class="product-grid">
        <article class="product-card">
          <div class="product-image">
            <img src="https://hellobubble.com/cdn/shop/products/PDP_MoisturizingBundle1.jpg?v=1668123441&width=832" alt="No More Dry Bundle" loading="lazy">
          </div>
          <div class="product-info">
            <p class="product-name">No More Dry Bundle</p>

        </article>
        <article class="product-card">

            <img src="https://hellobubble.com/cdn/shop/products/PDP_MaskBundle1.jpg?v=1701713704&width=832" alt="The Masknificent Three" loading="lazy">

            <p class="product-name">The Masknificent Three</p>

          </div>
        </article>
        <article class="product-card">
          <div class="product-image">
            <img src="https://hellobubble.com/cdn/shop/files/PDP_RISE-SHINE_2.jpg?v=1701713645&width=832" alt="The Base Routine" loading="lazy">
          </div>
          <div class="product-info">
            <p class="product-name">The Base Routine</p>
            <div class="product-row">
              <span class="product-price">$99</span>
              <button type="button" class="add-to-cart">Add to cart</button>
            </div>
          </div>
        </article>
      </div>
    </section>
